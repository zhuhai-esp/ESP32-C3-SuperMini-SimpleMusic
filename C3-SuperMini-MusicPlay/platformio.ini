[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = aac.csv

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_LITTLEFS_MTIME=y
    -D CONFIG_LITTLEFS_CACHE=y
    -D CONFIG_LITTLEFS_PAGE_SIZE=256
    -D CONFIG_LITTLEFS_BLOCK_SIZE=4096
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  earlephilhower/ESP8266Audio @ 2.2.0
  mathertel/OneButton @ ^2.6.2
